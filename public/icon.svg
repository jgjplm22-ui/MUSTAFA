<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer circular border -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" />

  <!-- Shopping Bag / Marketplace Arch Body -->
  <!-- Handle -->
  <path d="M 196 210 C 196 148, 316 148, 316 210" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Bag Body -->
  <path d="M 160 200 L 352 200 L 372 380 C 372 396, 360 408, 344 408 L 168 408 C 152 408, 140 396, 140 380 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Baghdad Palm / Star / Wheat Emblem inside -->
  <!-- Central Star -->
  <polygon points="256,252 266,278 294,278 271,295 280,321 256,305 232,321 241,295 218,278 246,278" fill="#ffffff" />
  
  <!-- Palm Frond Curves below star -->
  <path d="M 256 312 Q 230 340 210 365 M 256 312 Q 282 340 302 365" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 256 328 Q 236 352 220 372 M 256 328 Q 276 352 292 372" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
  <line x1="256" y1="305" x2="256" y2="385" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Badge Label: الشورجة -->
  <text x="256" y="445" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle" letter-spacing="2">أسواق الشورجة</text>
</svg>
